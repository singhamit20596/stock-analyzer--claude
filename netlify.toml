# The cloud deploy: a read-only website over data the laptop publishes.
#
# The laptop app (backend/, started by start.command) is the source of truth
# and the only place anything is written — imports, OCR, edits. Every change it
# makes is published as an encrypted JSON file (cloud/data/snapshot.json) pushed
# to this branch, which rebuilds the site. Functions decrypt it with DATA_KEY and
# fetch live prices themselves, so the site works with the laptop switched off.
# See CLOUD.md.

[build]
  base = "/"
  command = "cd frontend && npm ci && npm run build"
  publish = "frontend/dist"

[build.environment]
  # Netlify tooling needs Node 22; the laptop's Node 20 never builds this.
  NODE_VERSION = "22"
  # The frontend hides import and edit controls when this is set. The cloud API
  # also refuses every write, so this is presentation, not the safeguard.
  VITE_READ_ONLY = "1"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"
